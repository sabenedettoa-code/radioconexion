<!DOCTYPE html>
<html lang="es-419">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Noticias | Radio Conexión</title>
    
    <link rel="icon" type="image/png" href="https://www.dropbox.com/scl/fi/7h2pubomnn102d1rap4dr/Sin-Texto-versi-n-3D.png?rlkey=nd66shyykgea25m8c6sl2pp5d&st=dg874wjl&raw=1">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unica+One&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f5f7f8; color: #1c1c1c; line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px 120px 20px; }
        h1, h2, h3, .brand-logo span { font-family: 'Unica One', sans-serif; color: #c77f0d; font-weight: bold; }
        
        .btn-custom {
            background-color: #e5a919; color: #1c1c1c; padding: 12px 35px; border-radius: 25px;
            font-weight: bold; display: inline-block; box-shadow: 0 4px 10px rgba(229, 169, 25, 0.2); transition: all 0.3s ease;
        }

        header {
            background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 15px; z-index: 1000; margin: 15px auto 25px auto; max-width: 1240px;
            width: calc(100% - 40px); border-radius: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.4); padding: 0 25px; transition: background-color 0.3s;
        }
        .nav-wrapper { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; flex-wrap: wrap; }
        .brand-logo { display: flex; align-items: center; gap: 10px; }
        .brand-logo img { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; background-color: #ffffff; border: 1px solid #e5a919; }
        .brand-logo span { font-size: 24px; letter-spacing: 1px; }

        nav ul { display: flex; list-style: none; gap: 24px; align-items: center; }
        nav ul li a { color: #4a4a4a; font-size: 0.95rem; font-weight: 500; }
        nav ul li a.active, nav ul li a:hover { color: #e5a919; font-weight: bold; }

        .dark-btn { background: none; border: none; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 50%; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 26px; color: #c77f0d; cursor: pointer; width: 30px; text-align: center; }

        body.dark-mode { background-color: #121212 !important; color: #f5f7f8 !important; }
        body.dark-mode header, body.dark-mode .page-title-section, body.dark-mode .sticky-player-bar {
            background: rgba(28, 28, 28, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.1) !important; color: #e0e0e0 !important;
        }
        body.dark-mode p, body.dark-mode nav ul li a { color: #bbbbbb !important; }
        body.dark-mode nav ul li a.active { color: #e5a919 !important; }

        main { padding: 20px 0 40px 0; }
        .page-title-section {
            background: #ffffff; border-radius: 12px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid rgba(207,216,220,0.4);
            text-align: center; max-width: 1000px; margin: 0 auto 60px auto;
        }
        .page-title-section h1 { font-size: 34px; margin-bottom: 20px; }
        .page-title-section p { color: #4a4a4a; font-size: 15px; max-width: 700px; margin: 0 auto 30px auto; line-height: 1.8; }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            text-align: left;
        }
        .news-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(207,216,220,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .news-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #1c1c1c;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            line-height: 1.4;
        }
        .news-date {
            font-size: 11px;
            color: #c77f0d;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        body.dark-mode .news-card {
            background: rgba(28, 28, 28, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        body.dark-mode .news-card h3 {
            color: #f5f7f8 !important;
        }

        .sticky-player-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 600px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(229, 169, 25, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); border-radius: 20px;
            padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 9999;
        }
        .player-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .player-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .player-text strong { display: block; font-size: 13px; }
        .player-text small { color: #c77f0d; font-size: 11px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
        .equalizer-icon { display: flex; align-items: flex-end; gap: 3px; width: 16px; height: 16px; flex-shrink: 0; }
        .equalizer-icon span { width: 3px; background-color: #c77f0d; border-radius: 2px; animation: bounce 1.2s infinite ease-in-out; }
        .equalizer-icon span:nth-child(1) { height: 60%; animation-delay: -0.4s; }
        .equalizer-icon span:nth-child(2) { height: 100%; animation-delay: -0.2s; }
        .equalizer-icon span:nth-child(3) { height: 40%; animation-delay: 0s; }
        @keyframes bounce { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

        @media (max-width: 768px) {
            header { top: 10px; margin: 10px auto; width: calc(100% - 20px); padding: 12px 20px; border-radius: 20px; }
            .mobile-menu-btn { display: block; }
            nav#nav-menu { display: none; width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); }
            nav#nav-menu.nav-open { display: block !important; }
            nav ul { flex-direction: column; gap: 12px; align-items: center; padding: 5px 0; }
            .page-title-section { padding: 25px 15px; }
            .page-title-section h1 { font-size: 24pt; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="nav-wrapper">
            <div class="brand-logo">
                <img src="https://www.dropbox.com/scl/fi/7h2pubomnn102d1rap4dr/Sin-Texto-versi-n-3D.png?rlkey=nd66shyykgea25m8c6sl2pp5d&st=dg874wjl&raw=1" alt="Logo Radio Conexión">
                <span>Radio Conexión</span>
            </div>
            
            <button class="mobile-menu-btn" id="menu-toggle">☰</button>

            <nav id="nav-menu">
                <ul>
                    <li><a href="inicio">Inicio</a></li>
                    <li><a href="episodios">Episodios</a></li>
                    <li><a href="noticias" class="active">Noticias</a></li>
                    <li><a href="suscriptores">Zona de Suscriptores</a></li>
                    <li><a href="historia">Historia</a></li>
                    <li><button id="dark-mode-toggle" class="dark-btn">🌙</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-title-section">
            <h1>Noticias</h1>
            <p>Mantente informado con los titulares más recientes del feed de Google News en tiempo real.</p>

            <div id="news-feed" class="news-grid">
                <p style="grid-column: 1/-1; text-align: center; color: #8e8e8e;">Cargando últimas noticias...</p>
            </div>
        </div>
    </main>

    <div id="sticky-audio-player" class="sticky-player-bar">
        <div class="player-info">
            <div class="equalizer-icon"><span></span><span></span><span></span></div>
            <div class="player-text">
                <strong id="sticky-title">Radio Conexión</strong>
                <small id="sticky-subtitle">🎙️ Episodio 97 - ¡Novedades!</small>
            </div>
        </div>
        <a href="inicio#subscription-form" class="btn-custom" style="padding: 6px 14px; font-size: 11px;">Suscribirse</a>
    </div>

    <script>
        // Menú móvil y Modo Oscuro
        const menuToggleBtn = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('nav-menu');

        menuToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navMenu.classList.toggle('nav-open');
            const estaAbierto = navMenu.classList.contains('nav-open');
            menuToggleBtn.innerHTML = estaAbierto ? '✕' : '☰';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#main-header')) {
                if (navMenu.classList.contains('nav-open')) {
                    navMenu.classList.remove('nav-open');
                    menuToggleBtn.innerHTML = '☰';
                }
            }
        });

        const themeBtn = document.getElementById('dark-mode-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeBtn.innerText = '☀️';
        }

        // Función para renderizar el listado en el DOM
        function renderizarNoticias(items) {
            const container = document.getElementById('news-feed');
            container.innerHTML = '';

            items.slice(0, 9).forEach(item => {
                const title = item.title || 'Sin título';
                const link = item.link || '#';
                const pubDate = item.pubDate || item.pubdate || '';
                
                const dateObj = new Date(pubDate);
                const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div>
                        <span class="news-date">📰 ${dateStr}</span>
                        <h3>${title}</h3>
                    </div>
                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn-custom" style="padding: 6px 14px; font-size: 11px; text-align: center; margin-top: 15px;">Leer Noticia</a>
                `;
                container.appendChild(card);
            });
        }

        // Carga primaria mediante API RSS JSON compatible con HTTPS y CORS público
        const rssUrl = 'https://news.google.com/rss?hl=es-419&gl=CL&ceid=CL:es-419';
        const primaryApi = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        fetch(primaryApi)
            .then(res => {
                if (!res.ok) throw new Error('Error en API primaria');
                return res.json();
            })
            .then(data => {
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    renderizarNoticias(data.items);
                } else {
                    throw new Error('Respuesta vacía');
                }
            })
            .catch(() => {
                // Métodos de respaldo (Fallback) vía proxy seguro HTTPS
                const fallbackApi = `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`;
                fetch(fallbackApi)
                    .then(res => res.text())
                    .then(xmlText => {
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                        const rawItems = xmlDoc.querySelectorAll("item");
                        const parsedItems = Array.from(rawItems).map(item => ({
                            title: item.querySelector("title")?.textContent || '',
                            link: item.querySelector("link")?.textContent || '#',
                            pubDate: item.querySelector("pubDate")?.textContent || ''
                        }));

                        if (parsedItems.length > 0) {
                            renderizarNoticias(parsedItems);
                        } else {
                            document.getElementById('news-feed').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No hay noticias disponibles en este momento.</p>';
                        }
                    })
                    .catch(() => {
                        document.getElementById('news-feed').innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error al cargar las noticias. Intenta recargar la página.</p>';
                    });
            });
    </script>
</body>
</html>
